<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;padding:0;background:transparent;color:var(--foreground);font-family:var(--font-sans);font-size:14px}
figure{margin:0}figcaption{font-size:16px;font-weight:600;margin-bottom:8px}
.note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin:8px 0}
.row{display:grid;grid-template-columns:135px minmax(50px,1fr) 68px;gap:12px;align-items:center;min-height:58px}
.label{font-size:13px}.company{font-size:11px;color:var(--muted-foreground)}
.track{height:20px;background:var(--secondary);border-radius:3px;overflow:hidden}
.bar{height:20px;background:var(--chart-1);border-radius:3px}
.value{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:135px minmax(50px,1fr) 68px;gap:12px;color:var(--muted-foreground);font-size:11px}
.ticks{display:flex;justify-content:space-between}
@media(max-width:480px){.row,.axis{grid-template-columns:90px minmax(50px,1fr) 58px;gap:8px}.label{font-size:12px}}
