<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal GD (simulado){% endblock %}</title>
  <link rel="stylesheet" href="/static/portal.css?v={{ v }}">
</head>
<body class="portal">
  <div class="aviso-simulado" role="note">
    <p><strong>Simulação</strong> de portal de distribuidora para a demonstração do dia, testada com Enel e Equatorial. Dados sintéticos.</p>
    <a class="voltar-dia" href="/painel">Voltar ao dia</a>
  </div>
  <header class="cabeca-portal">
    <a class="nome-portal" href="/portal-gd">Portal GD (simulado)</a>
    <nav aria-label="Principal">
      <a href="/portal-gd">Início</a>
      <a href="/portal-gd/consulta">Consultar solicitação</a>
    </nav>
  </header>
  <main class="miolo">{% block conteudo %}{% endblock %}</main>
</body>
</html>
