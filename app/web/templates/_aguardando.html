{# Aviso de espera enquanto o agente trabalha. Consulta o processo a cada 2 s e
   recarrega a página sozinha quando a etapa, as perguntas ou os documentos mudam. #}
<div class="trabalhando aguardando" role="status" aria-live="polite" data-processo="{{ p.id }}"
     data-assinatura="{{ p.etapa.value }}#{{ p.perguntas|rejectattr('resposta')|list|length }}">
  <span class="girando" aria-hidden="true"></span>
  <p><strong>O agente está trabalhando.</strong> <span class="aguardando-texto"></span></p>
</div>
<script>
(function () {
  var aviso = document.currentScript.previousElementSibling;
  var pid = aviso.dataset.processo;
  var inicio = Date.now();
  // Compara com o que estava na tela quando a página abriu: se o agente terminou
  // antes da primeira consulta, a mudança já é detectada nela.
  var antes = aviso.dataset.assinatura;
  function assinatura(p) {
    var abertas = p.perguntas.filter(function (q) { return !q.resposta; }).length;
    return p.etapa + "#" + abertas;
  }
  async function olhar() {
    try {
      var r = await fetch("/api/processos/" + encodeURIComponent(pid), { cache: "no-store" });
      if (r.ok) {
        var agora = assinatura(await r.json());
        if (agora !== antes) { location.reload(); return; }
      }
    } catch (e) {}
    if (Date.now() - inicio > 120000) {
      aviso.querySelector(".aguardando-texto").innerHTML =
        'Está demorando mais que o normal. Continuo esperando; o que o agente fez até agora está na <a href="/processos/' + encodeURIComponent(pid) + '/timeline">timeline</a>.';
    }
    setTimeout(olhar, Date.now() - inicio > 120000 ? 5000 : 2000);
  }
  olhar();
})();
</script>
