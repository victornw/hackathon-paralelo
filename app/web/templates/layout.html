<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="dia: gestão e homologação de projetos solares, documentos e prazos.">
  <meta name="theme-color" content="#ddf1f8">
  <title>{% block titulo %}Carteira{% endblock %} · dia</title>
  <script>
    /* O sol nasce uma vez por sessão; nas navegações seguintes a página só aparece. */
    try { if (!sessionStorage.getItem("dia-amanheceu")) { document.documentElement.classList.add("amanhecer"); sessionStorage.setItem("dia-amanheceu", "1"); } } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/painel.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="horizonte {% block corpo_classe %}{% endblock %}">
  <div class="luz-ambiente" aria-hidden="true"></div>
  {% set caminho = request.url.path %}
  <header class="topo">
    <a class="marca" href="/" aria-label="dia, gestão e homologação: ir para o início">
      <span class="marca-sinal" aria-hidden="true"></span>
      <span class="marca-nome"><svg class="marca-logotipo" viewBox="0 0 98 48" aria-hidden="true" focusable="false">
        <path fill="currentColor" fill-rule="evenodd" d="M25 3h8v41h-8v-4c-2.6 3.3-6 5-10 5C6 45 1 38.4 1 29.5S6.5 14 15 14c4.1 0 7.4 1.6 10 4.7V3ZM17 21c-5 0-8 3.5-8 8.5s3 8.5 8 8.5 8-3.5 8-8.5-3-8.5-8-8.5Z"/>
        <path fill="currentColor" d="M43 15h8v29h-8z"/>
        <circle class="marca-ponto" cx="47" cy="6" r="4.5"/>
        <path fill="currentColor" fill-rule="evenodd" d="M82 15h8v29h-8v-4c-2.5 3.3-6 5-10 5-9 0-14-6.6-14-15.5S63.5 14 72 14c4 0 7.5 1.6 10 4.7V15ZM74 21c-5 0-8 3.5-8 8.5s3 8.5 8 8.5 8-3.5 8-8.5-3-8.5-8-8.5Z"/>
      </svg><span class="marca-texto">dia</span></span>
      <span class="marca-sub">gestão e homologação</span>
    </a>
    <nav aria-label="Principal">
      <a href="/"{% if caminho == '/' %} aria-current="page"{% endif %}>Início</a>
      <a href="/painel"{% if caminho == '/painel' or (caminho.startswith('/processos/') and not caminho.startswith('/processos/novo')) %} aria-current="page"{% endif %}>Carteira</a>
      <a href="/metricas"{% if caminho == '/metricas' %} aria-current="page"{% endif %}>Métricas</a>
      <a href="/processos/novo"{% if caminho.startswith('/processos/novo') %} aria-current="page"{% endif %}>Novo processo</a>
      <a href="/portal-gd">Portal GD</a>
      <a href="/portal-gd/operador"{% if caminho.startswith('/portal-gd/operador') %} aria-current="page"{% endif %}>Operador</a>
    </nav>
    <div class="relogio" role="group" aria-label="Relógio simulado">
      <span>Hoje <strong>{{ hoje.strftime('%d/%m/%Y') }}</strong></span>
      <button type="button" class="secundario mini" data-avancar="1">Avançar 1 dia</button>
      <button type="button" class="mini" data-avancar="20">Avançar 20 dias</button>
    </div>
  </header>
  <p id="erro-relogio" class="erro-form erro-flutuante" role="alert"></p>
  <script>
    document.querySelectorAll("[data-avancar]").forEach(function (b) {
      b.addEventListener("click", function () {
        var erro = document.getElementById("erro-relogio");
        erro.textContent = "";
        document.querySelectorAll("[data-avancar]").forEach(function (x) { x.disabled = true; });
        fetch("/api/relogio/avancar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dias: parseInt(b.dataset.avancar, 10) }) })
          .then(function (r) { if (!r.ok) { throw new Error(); } location.reload(); })
          .catch(function () {
            erro.textContent = "Não foi possível avançar o relógio. Tente de novo.";
            document.querySelectorAll("[data-avancar]").forEach(function (x) { x.disabled = false; });
          });
      });
    });
  </script>
  <p class="selo-simulacao" role="note">Simulação: dados sintéticos e portal da Enel simulado</p>
  <main>{% block conteudo %}{% endblock %}</main>
  <link rel="stylesheet" href="/static/horizonte.css">
</body>
</html>
